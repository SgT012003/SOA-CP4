{{ template "header.html" . }}

<div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-pink-600">Salas Disponíveis</h1>
    <button onclick="document.getElementById('modal-sala').classList.remove('hidden')" class="bg-gradient-to-r from-cyan-500 to-blue-500 hover:from-cyan-600 hover:to-blue-600 text-white px-6 py-2.5 rounded-full font-medium shadow-md shadow-cyan-500/30 transition-all flex items-center space-x-2 transform hover:-translate-y-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span>Nova Sala</span>
    </button>
</div>

<!-- Loading state -->
<div id="loading" class="text-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-500 mx-auto"></div>
    <p class="mt-4 text-slate-500 text-sm font-medium">Carregando salas...</p>
</div>

<!-- Lista de Salas Grid -->
<div id="salas-grid" class="grid grid-cols-1 md:grid-cols-2 mt-4 lg:grid-cols-3 gap-6 hidden">
    <!-- Renderizado por JS -->
</div>

<!-- Modal Criar Sala -->
<div id="modal-sala" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl relative">
        <button onclick="document.getElementById('modal-sala').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-full p-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <h2 class="text-2xl font-bold mb-6 text-slate-800">Cadastrar Nova Sala</h2>
        
        <form id="form-sala" onsubmit="handleNovaSala(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nome da Sala</label>
                <input type="text" id="sala-nome" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:bg-white transition-all outline-none" placeholder="Ex: Sala Alpha">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Capacidade (pessoas)</label>
                <input type="number" id="sala-capac" required min="1" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:bg-white transition-all outline-none" placeholder="10">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Localização</label>
                <input type="text" id="sala-local" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:bg-white transition-all outline-none" placeholder="Ex: 3º Andar">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                <select id="sala-status" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-cyan-500 outline-none">
                    <option value="ATIVA">Ativa</option>
                    <option value="INATIVA">Inativa</option>
                </select>
            </div>
            <button type="submit" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl shadow-lg transition-colors">
                Salvar Sala
            </button>
        </form>
    </div>
</div>

{{ template "footer.html" . }}
<script>
    document.addEventListener("DOMContentLoaded", carregarSalas);
</script>
