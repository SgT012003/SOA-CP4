{{ template "header.html" . }}

<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 relative overflow-hidden">
    <!-- Decorative element -->
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-cyan-400 to-pink-500"></div>
    
    <div id="login-section">
        <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-pink-600 mb-6 text-center">Login</h2>
        
        <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail Corporativo</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all placeholder-slate-400" placeholder="admin@empresa.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input type="password" id="login-senha" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-all" placeholder="••••••••">
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-pink-500 hover:from-cyan-600 hover:to-pink-600 text-white font-semibold py-3 rounded-xl shadow-md transform hover:-translate-y-0.5 transition-all">
                    Acessar
                </button>
            </div>
        </form>
        <p class="mt-4 text-center text-sm text-slate-500">
            Não tem uma conta? <button onclick="toggleAuthMode()" class="text-pink-600 font-medium hover:underline">Registre-se</button>
        </p>
    </div>

    <!-- Registro -->
    <div id="register-section" class="hidden">
        <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-600 to-pink-600 mb-6 text-center">Cadastrar-se</h2>
        
        <form id="register-form" class="space-y-4" onsubmit="handleRegister(event)">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo</label>
                <input type="text" id="reg-nome" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all" placeholder="Seu Nome">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">E-mail Corporativo</label>
                <input type="email" id="reg-email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all" placeholder="você@empresa.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                <input type="password" id="reg-senha" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition-all" minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="pt-2">
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-semibold py-3 rounded-xl shadow-md transform hover:-translate-y-0.5 transition-all">
                    Criar Conta
                </button>
            </div>
        </form>
        <p class="mt-4 text-center text-sm text-slate-500">
            Já tem conta? <button onclick="toggleAuthMode()" class="text-cyan-600 font-medium hover:underline">Faça Login</button>
        </p>
    </div>

    <div id="auth-alert" class="hidden mt-4 p-3 rounded-lg text-sm font-medium text-center"></div>
</div>

{{ template "footer.html" . }}
<script>
    // Se ja tem token, vai pra salas
    if (localStorage.getItem("token")) {
        window.location.href = "/salas";
    }

    function toggleAuthMode() {
        document.getElementById('login-section').classList.toggle('hidden');
        document.getElementById('register-section').classList.toggle('hidden');
    }
</script>
