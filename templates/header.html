{{ define "header.html" }}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .Title }}{{ .Title }} | {{ end }}Agendamento de Salas</title>
    <!-- CSS Compilado do Tailwind -->
    <link href="/public/css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-gradient-to-r from-cyan-500 to-pink-500 text-white shadow-lg shadow-pink-500/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <span class="font-bold tracking-wide text-xl">Agendamento<span class="font-light">PRO</span></span>
            </div>
            <nav class="hidden md:flex space-x-6" id="main-nav">
                <!-- Mostrado apenas se logado -->
                <a href="/salas" class="hover:text-pink-100 font-medium transition-colors">Salas</a>
                <a href="/reservas" class="hover:text-pink-100 font-medium transition-colors">Minhas Reservas</a>
                <button onclick="logout()" class="hover:bg-white/20 px-4 py-2 rounded-full font-medium transition-colors">Sair</button>
            </nav>
        </div>
    </header>

    <!-- Main Content injected by child templates -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full block">
{{ end }}
