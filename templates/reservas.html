{{ template "header.html" . }}

<div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-600 to-orange-500">Minhas Reservas</h1>
    <button onclick="abrirModalReserva()" class="bg-gradient-to-r from-pink-500 to-orange-500 hover:from-pink-600 hover:to-orange-600 text-white px-6 py-2.5 rounded-full font-medium shadow-md shadow-pink-500/30 transition-all flex items-center space-x-2 transform hover:-translate-y-0.5">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span>Agendar Sala</span>
    </button>
</div>

<div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-slate-50 text-slate-500 font-medium text-sm border-b border-slate-200 uppercase tracking-wider">
                    <th class="p-4">Sala</th>
                    <th class="p-4 hidden sm:table-cell">Finalidade</th>
                    <th class="p-4">Data & Horário</th>
                    <th class="p-4 hidden md:table-cell">Criador</th>
                    <th class="p-4 text-center">Status</th>
                    <th class="p-4 text-right">Ações</th>
                </tr>
            </thead>
            <tbody id="tbl-reservas" class="divide-y divide-slate-100">
                <tr>
                    <td colspan="6" class="p-8 text-center text-slate-500">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-pink-500 mx-auto"></div>
                        <p class="mt-2">Carregando...</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Criar Reserva -->
<div id="modal-reserva" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 max-w-lg w-full mx-4 shadow-2xl relative">
        <button onclick="document.getElementById('modal-reserva').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-full p-2 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <h2 class="text-2xl font-bold mb-2 text-slate-800">Novo Agendamento</h2>
        <p class="text-slate-500 text-sm mb-6">Preencha os detalhes para reservar uma sala.</p>

        <form id="form-reserva" onsubmit="handleNovaReserva(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Sala</label>
                <select id="reserva-sala" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none">
                    <option value="">Carregando salas...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Data</label>
                <input type="date" id="reserva-data" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Início</label>
                    <input type="time" id="reserva-inicio" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fim</label>
                    <input type="time" id="reserva-fim" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Finalidade</label>
                <input type="text" id="reserva-motivo" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 outline-none" placeholder="Motivo da reunião">
            </div>
            <button type="submit" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl shadow-lg transition-colors">
                Confirmar Reserva
            </button>
        </form>
    </div>
</div>

{{ template "footer.html" . }}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        carregarReservas();
    });
</script>
